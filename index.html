<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Game</title>
    <script src="js/script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body class="font-poppins">
    <div class="flex h-screen w-full items-center justify-center bg-[#F1F5F9]">
      <div
        class="flex flex-col gap-8 rounded-3xl border border-[#E2E8F0] bg-white p-10 drop-shadow-[0px_12px_24px_rgba(15,23,42,0.0509804)]"
      >
        <div class="flex w-112.5 flex-col gap-3">
          <div class="self-center rounded-full bg-[#EEF2FF] px-3 py-1.5">
            🎯 Mini Game
          </div>
          <h1 class="text-center text-4xl font-extrabold text-[#0F172A]">
            Guess the Number
          </h1>
          <h3 class="w-full text-center text-[15px] font-medium text-[#475569]">
            I'm thinking of a secret number between 1 and 100. Try to guess it.
          </h3>
        </div>

        <div
          id="errorHigh"
          class="banner flex w-112.5 items-center justify-start gap-3 rounded-xl border border-[#FCA5A5] bg-[#FEF2F2] p-4"
          hidden
        >
          <i class="ti ti-circle-arrow-up text-[20px] text-[#991B1B]"></i>
          <span class="text-left text-[15px] font-semibold text-[#991B1B]"
            >Too high! Try a lower number.</span
          >
        </div>

        <div
          id="errorLow"
          class="banner flex w-112.5 items-center justify-start gap-3 rounded-xl border border-[#FCA5A5] bg-[#FEF2F2] p-4"
          hidden
        >
          <i class="ti ti-circle-arrow-down text-[20px] text-[#991B1B]"></i>
          <span class="text-left text-[15px] font-semibold text-[#991B1B]"
            >Too low! Try a higher number.</span
          >
        </div>

        <div
          id="successBanner"
          class="banner flex w-112.5 items-center justify-start gap-3 rounded-xl border border-green-300 bg-green-200 p-4"
          hidden
        >
          <i class="ti ti-circle-check text-[20px] text-green-700"></i>
          <span class="text-left text-[15px] font-semibold text-green-700"
            >Success! You guessed the number.</span
          >
        </div>

        <div
          id="errorNaN"
          class="banner flex w-112.5 items-center justify-start gap-3 rounded-xl border border-[#FCA5A5] bg-[#FEF2F2] p-4 ml-3banner "
          hidden
        >
          <i class="ti ti-circle-x text-[20px] text-[#991B1B]"></i>
          <span class="text-left text-[15px] font-semibold text-[#991B1B]"
            >Guess must be an integer between 1 and 100.</span
          >
        </div>
        <div class="flex w-112.5 flex-col gap-4 pl-3">
          <h3 class="text-left text-[13px] font-bold text-[#475569] uppercase">
            Your Guess
          </h3>
          <input
            type="number"
            id="guessInput"
            class="w-full rounded-xl border-2 border-[#E2E8F0] bg-[#F8FAFC] p-4 text-[15px] text-[#0F172A] caret-[#4F46E5] transition-colors duration-300 focus:border-[#4F46E5] focus:outline-none"
            placeholder="Enter your guess"
          />
          <button
            id="submitBtn"
            class="h-13 w-full cursor-pointer rounded-xl bg-indigo-600 font-semibold text-white"
          >
            Submit Guess
          </button>
        </div>
        <div class="ml-3 h-px w-109.75 bg-[#E2E8F0]"></div>
        <div class="flex w-112.5 items-center justify-between pl-3">
          <span class="text-[13px] font-medium text-[#475569]"
            >Want to start over?</span
          >
          <button
            id="resetBtn"
            type="reset"
            class="h-10 cursor-pointer rounded-lg border border-[#E2E8F0] px-4 text-[14px] font-semibold text-[#0F172A]"
          >
            🔄 New Game
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
